# render.yaml - Render deployment config
services:
  - type: web
    name: shl-recommender
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CATALOG_PATH
        value: data/catalog.json
      - key: FAISS_INDEX_PATH
        value: data/faiss_index
      - key: LOG_LEVEL
        value: INFO
